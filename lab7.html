<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events and Interactivity</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f7fa;
        }

        h1 {
            color: #0d47a1;
        }

        #hoverArea {
            width: 250px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            background-color: #bbdefb;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>23/EG/CO/135</h1>

    <button id="clickButton">Click Me</button>

    <br><br>

    <input type="text" id="textInput" placeholder="Type something here">

    <div id="hoverArea">
        Move your mouse over this box
    </div>

    <h3>Counter: <span id="counter">0</span></h3>

    <button id="counterButton">Increase Counter</button>

    <br><br>

    <input type="email" id="email" placeholder="Enter your email">

    <button id="validateButton">Validate Email</button>

    <p id="feedback"></p>

    <h3 id="timerText">This message will change in 5 seconds.</h3>

    <script>

        document.getElementById("clickButton").addEventListener("click", function () {
            alert("Button clicked successfully!");
        });

        document.getElementById("textInput").addEventListener("keyup", function (event) {
            console.log("Key Pressed: " + event.key);
        });

        document.getElementById("hoverArea").addEventListener("mouseover", function () {
            this.style.backgroundColor = "#81c784";
        });

        document.getElementById("hoverArea").addEventListener("mouseout", function () {
            this.style.backgroundColor = "#bbdefb";
        });

        let count = 0;

        document.getElementById("counterButton").addEventListener("click", function () {
            count++;
            document.getElementById("counter").textContent = count;
        });

        document.getElementById("validateButton").addEventListener("click", function () {

            let email = document.getElementById("email").value;

            if (email.includes("@")) {
                document.getElementById("feedback").textContent = "Valid email address.";
                document.getElementById("feedback").style.color = "green";
            } else {
                document.getElementById("feedback").textContent = "Invalid email address.";
                document.getElementById("feedback").style.color = "red";
            }

        });

        setTimeout(function () {
            document.getElementById("timerText").textContent =
                "The text has been updated after 5 seconds.";
        }, 5000);

    </script>

</body>
</html>
